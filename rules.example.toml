# Herdr Tab Autorun example configuration.
# The initializer copies this file to rules.toml in the plugin config directory.
# The config directory is printed by:
#   herdr plugin config-dir han.tab-autorun
# Defaults may enable autorun, but no rule runs until you uncomment a rule below.

[defaults]
enabled = true
ready_timeout_ms = 8000
poll_interval_ms = 60
total_timeout_ms = 15000
rate_limit_count = 5
rate_limit_window_ms = 10000

# Opt in for one repository: replace YOUR_REPO_NAME with its exact repo name,
# then uncomment this entire rule. It can match both ordinary and linked
# worktrees of that repository; add is_linked_worktree only if you want to narrow it.
# The command runs in the new tab's shell; use only trusted shell command text.
# [[rules]]
# name = "repo proof"
# [rules.when]
# repo_name = "YOUR_REPO_NAME"
# [rules.run]
# mode = "command"
# command = "echo HERDR_TAB_AUTORUN_PROOF"

# Optional predicates (combine with AND when placed in one rule's [rules.when]):
# repo_root = "/path/to/repository"       # exact repository root
# cwd_glob = "~/workspace/**"              # focused pane or workspace cwd; *, **, ?
# tab_label = "^scratch"                   # regular expression
# workspace_label = ["backend", "frontend"] # exact label; arrays accept any listed value
# invocation_source = ["api"]              # exact source; arrays accept any listed value
# is_linked_worktree = true                # true: linked only; false: ordinary only
# Rules are checked top to bottom; the first matching rule wins. Put more
# specific rules before broad rules. No predicate above is active as written.

# Optional scoped agent example: uncomment only after choosing your repository
# and ensuring the agent command is installed and available in the new tab's shell.
# [[rules]]
# name = "repo agent"
# [rules.when]
# repo_name = "YOUR_REPO_NAME"
# [rules.run]
# mode = "agent"
# kind = "omp"
# name = "omp"
# agent_args = ["--no-session"]
# prompt = "summarize repo"

# Optional scoped skip example: a matching rule explicitly suppresses autorun.
# Place before the command rule if it should take precedence for these tabs.
# [[rules]]
# name = "repo manual tabs"
# [rules.when]
# repo_name = "YOUR_REPO_NAME"
# tab_label = "^manual"
# [rules.run]
# mode = "skip"
